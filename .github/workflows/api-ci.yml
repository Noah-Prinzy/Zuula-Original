name: API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - ".github/workflows/api-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # A real PostgreSQL with pgvector for migrations and tests/db/ (ADR 0002 §8). Redis stays
    # faked in-process (fakeredis), as in P2.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: zuula
          POSTGRES_PASSWORD: zuula
          POSTGRES_DB: zuula
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zuula"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://zuula:zuula@localhost:5432/zuula
      TEST_DATABASE_URL: postgresql+asyncpg://zuula:zuula@localhost:5432/zuula_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check app/db app/services migrations tests/db

      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Tests (contract, pipeline, adapters, db)
        run: pytest tests/ -q

  openapi-spec:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openapi-spec-validator
        run: pip install openapi-spec-validator pyyaml

      - name: Validate openapi.yaml structurally
        run: |
          python -c "
          from openapi_spec_validator import validate
          import yaml
          with open('openapi.yaml') as f:
              validate(yaml.safe_load(f))
          print('openapi.yaml: structurally valid')
          "
