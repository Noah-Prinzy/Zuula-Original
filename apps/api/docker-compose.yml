services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ZUULA_CORS_ORIGINS: "http://localhost:3000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # Runs `alembic upgrade head` once, then exits; api and worker wait for it. Load the sample
  # data afterwards with: docker compose run --rm api python -m app.db.seed
  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # PostgreSQL 16 with the pgvector extension (fact_check_reports.embedding, ADR 0002 §3).
  postgres:
    image: pgvector/pgvector:pg16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuula"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: zuula
      POSTGRES_PASSWORD: zuula
      POSTGRES_DB: zuula
    ports:
      - "5432:5432"
    volumes:
      - zuula_postgres_data:/var/lib/postgresql/data

volumes:
  zuula_postgres_data:
