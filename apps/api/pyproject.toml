[project]
name = "zuula-api"
version = "0.1.0"
description = "Zuula (Uganda Fact-Guard) API — P2 skeleton. Every endpoint returns stub data that validates against openapi.yaml; P3 replaces the stubs with real logic."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "celery[redis]>=5.4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "openapi-core>=0.19",
  # Not declared by openapi-core itself, but required at runtime by its Starlette/FastAPI
  # contrib middleware (used in tests/contract/) — confirmed missing from a clean install.
  "aioitertools>=0.11",
  # tests/pipeline/ — a fake Redis (sync + async) so the pipeline/realtime tests don't need
  # a live Redis server.
  "fakeredis>=2.26",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP047: stick to typing.TypeVar rather than PEP 695 `def f[T](...)` syntax for now — this
# sandbox's dev Python is 3.11 (the container image is 3.12), and TypeVar reads identically on
# both. Revisit once local dev also runs 3.12.
ignore = ["UP047"]

[tool.ruff.lint.per-file-ignores]
# Stub data files are intentionally one-object-per-line for reviewability against the TS
# mocks they're transliterated from; wrapping each one would make the diff harder to audit.
"app/stubs/*.py" = ["E501"]
# Contract test cases are one-request-per-line for readability against the endpoints they
# exercise; wrapping each json= payload would make the test list harder to scan.
"tests/contract/*.py" = ["E501"]
"tests/pipeline/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
